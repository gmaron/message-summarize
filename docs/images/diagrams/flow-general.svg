<svg role="img" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1318 292" width="1318" height="292"><title>General flow: messages reach you, the app saves them on your computer, an AI summarizes them on your schedule and you get the note in your own chat. The app never replies for you, never writes to anyone else, never marks you online and never sends usage data.</title><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
